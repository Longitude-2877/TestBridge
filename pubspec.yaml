name: elder_launcher
description: Elder friendly fullscreen launcher
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  battery_plus: ^6.0.0
  permission_handler: ^11.3.0
  gal: ^2.3.0
  wakelock_plus: ^1.2.0
  photo_manager: ^3.6.0
  video_player: ^2.9.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.3
  torch_light: ^1.0.0
  flutter_volume_controller: ^2.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
